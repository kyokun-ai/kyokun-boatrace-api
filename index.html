<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キョウ君 BOATRACE AI</title>
<style>
body{margin:0;background:#07111f;color:#eef6ff;font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:720px;margin:auto;padding:18px}
h1{font-size:24px;margin:4px 0}.sub{color:#9db2c9;margin-bottom:18px}
.panel,.result{background:#101d2d;border:1px solid #263b53;border-radius:16px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
label{font-size:12px;color:#a9bed3}input,select,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #36506c;padding:11px;font-size:16px}
input,select{background:#0b1725;color:white}button{background:#1687ff;color:white;font-weight:800;margin-top:12px;cursor:pointer}
button:disabled{opacity:.5}.status{margin-top:10px;color:#b8cbe0}
.betbox{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.bet{background:#071421;border-radius:10px;padding:10px;text-align:center;font-size:20px;font-weight:900}
.main{border-left:4px solid #39a5ff}.diff{border-left:4px solid #ffb340}
.meta{font-size:14px;color:#b9cbe0;line-height:1.7}.hidden{display:none}
.warn{font-size:13px;color:#ffcf70;margin-top:10px}
</style>
</head>
<body><div class="wrap">
<h1>🚤 キョウ君 BOATRACE AI</h1>
<div class="sub">STEP3｜試作予想エンジン</div>

<div class="panel">
  <div class="grid">
    <div><label>日付</label><input id="date" type="date"></div>
    <div><label>場</label><select id="jcd"></select></div>
    <div><label>R</label><select id="rno"></select></div>
  </div>
  <button id="predict">キョウ君に予想してもらう</button>
  <div class="status" id="status">オッズは予想に使用しません。</div>
</div>

<div id="result" class="result hidden">
  <h2>🎯 キョウ君予想</h2>
  <div class="meta" id="meta"></div>
  <h3>本線7点</h3><div class="betbox" id="main"></div>
  <h3>差し頭2点</h3><div class="betbox" id="diff"></div>
  <div class="warn">※ 試作ロジック。過去結果との照合で1点ずつ修正して育てます。</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const today=new Date(); $('date').value=today.toISOString().slice(0,10);
for(let i=1;i<=24;i++){const o=document.createElement('option');o.value=String(i).padStart(2,'0');o.textContent=String(i).padStart(2,'0');$('jcd').appendChild(o)}
for(let i=1;i<=12;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'R';$('rno').appendChild(o)}

$('predict').onclick=async()=>{
  const date=$('date').value.replaceAll('-',''), jcd=$('jcd').value, rno=$('rno').value;
  $('predict').disabled=true; $('status').textContent='公式データ取得 → 特徴量計算 → 9点作成中…';
  $('result').classList.add('hidden');
  try{
    const [raceRes,beforeRes]=await Promise.all([
      fetch(`/api/race?date=${date}&jcd=${jcd}&rno=${rno}`),
      fetch(`/api/beforeinfo?date=${date}&jcd=${jcd}&rno=${rno}`)
    ]);
    const race=await raceRes.json(), before=await beforeRes.json();
    if(!race.ok) throw new Error('出走データ取得失敗: '+(race.error||'unknown'));
    if(!before.ok) throw new Error('直前情報取得失敗: '+(before.error||'unknown'));

    const pRes=await fetch('/api/predict',{
      method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({race,before})
    });
    const p=await pRes.json();
    if(!p.ok) throw new Error(p.error||'予想失敗');

    $('meta').innerHTML=
      `自信度：<b>${p.prediction.confidence}</b><br>`+
      `想定進入：${(p.entryOrder||[]).join('-') || '不明'}<br>`+
      `本線頭：${p.prediction.mainHead}号艇 ／ 差し頭：${p.prediction.differenceHead}号艇<br>`+
      `オッズ使用：なし`;
    $('main').innerHTML=p.prediction.main.map(x=>`<div class="bet main">${x}</div>`).join('');
    $('diff').innerHTML=p.prediction.difference.map(x=>`<div class="bet diff">${x}</div>`).join('');
    $('result').classList.remove('hidden');
    $('status').textContent='予想完成🔥';
  }catch(e){$('status').textContent='エラー：'+e.message}
  finally{$('predict').disabled=false}
};
</script></body></html>
