<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キョウ君AI STEP1-B</title><style>body{font-family:system-ui,sans-serif;background:#081526;color:#eef6ff;margin:0;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#10233c;border:1px solid #294563;border-radius:16px;padding:16px;margin:14px 0}label{display:block;margin:8px 0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #49647f}button{background:#10b981;color:#06231b;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.boat{padding:12px;border-bottom:1px solid #294563}small{color:#a9bfd6}.err{color:#ffb4b4}.ok{color:#8ff0c7}</style></head><body><div class="wrap"><h1>🚤 キョウ君AI STEP1-B</h1><div class="card"><label>API URL<input id="api" placeholder="https://xxxx.onrender.com" style="width:100%;box-sizing:border-box"></label><div class="grid"><label>日付<input id="date" type="date"></label><label>競艇場<select id="jcd"></select></label><label>R<select id="rno"></select></label></div><button id="get">🔄 最新情報取得</button><p id="status"><small>API設置後、そのURLを一度入力してください。</small></p></div><div class="card"><h2>出走情報</h2><div id="out">未取得</div></div></div><script>const venues=['01 桐生','02 戸田','03 江戸川','04 平和島','05 多摩川','06 浜名湖','07 蒲郡','08 常滑','09 津','10 三国','11 びわこ','12 住之江','13 尼崎','14 鳴門','15 丸亀','16 児島','17 宮島','18 徳山','19 下関','20 若松','21 芦屋','22 福岡','23 唐津','24 大村'];const j=document.querySelector('#jcd');venues.forEach(v=>{let o=document.createElement('option');o.value=v.slice(0,2);o.textContent=v;j.append(o)});const r=document.querySelector('#rno');for(let i=1;i<=12;i++){let o=document.createElement('option');o.value=i;o.textContent=i+'R';r.append(o)};document.querySelector('#date').value=new Date().toISOString().slice(0,10);document.querySelector('#get').onclick=async()=>{const s=document.querySelector('#status'),out=document.querySelector('#out');let base=document.querySelector('#api').value.trim().replace(/\/$/,'');if(!base){s.innerHTML='<span class="err">API URLを入力してください。</span>';return}let d=document.querySelector('#date').value.replaceAll('-','');s.textContent='取得中…';try{let x=await fetch(`${base}/api/race?date=${d}&jcd=${j.value}&rno=${r.value}`);let z=await x.json();if(!z.ok)throw new Error(z.error||'取得失敗');s.innerHTML='<span class="ok">取得成功</span>';out.innerHTML=z.racers.length?z.racers.map((b,i)=>`<div class="boat"><b>${i+1}号艇</b>　登録 ${b.registration}　${b.rank}<br><small>${b.raw}</small></div>`).join(''):`<p>API接続成功。ただし選手情報の解析がまだ一致していません。次版で公式HTML構造に合わせて調整します。</p><details><summary>取得した公式テキストを確認</summary><pre style="white-space:pre-wrap">${z.officialText.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre></details>`}catch(e){s.innerHTML='<span class="err">'+e.message+'</span>'}};</script></body></html>
